# =====================================================================
#  Skagerrak surf agent - spotdefinisjoner
# =====================================================================
#  ALT i denne fila er tunbart. Ingen av tallene er malt - de er utledet
#  fra fetch-geometri og et grovt energibudsjett. Kalibrer mot egen logg.
#
#  facing:        retningen brytningen SER MOT = retningen palandsvind
#                 kommer fra. Slagen facing=120 -> vika apner mot OSO.
#  swell_window:  [lo, hi] meteorologiske grader, sektoren som gir bolger.
#                 STOPP (ordre 2026-09-03, se rapport til bruker) - IKKE
#                 forsok aa utlede/etterproeve denne mot kystkontur.geojson
#                 via straalekasting igjen, verken enkelt- eller
#                 kjeglekasting (build_fetch.compute_fetch_72_kjegle()) fra
#                 spottens eget koordinat. Forsokt: samme feilklasse som
#                 STOPP-notatet for fetch_km_72* i build_fetch.py sin
#                 topptekst - en straale (eller kjegle av dem) smetter
#                 gjennom et trangt, men LANGT sund/kanal og rapporterer
#                 "apent" 50-225 grader unna faktisk swell-retning. Bekreftet
#                 paa flere kjente spot: rakke (facing 170, "N/NNV fralands"
#                 i notes) fikk beregnet sektor sentrert paa 345 grader;
#                 skallevold og larkollen samme mønster (>100 graders avvik,
#                 rett imot egne notes); portoer fikk INGEN aapen retning i
#                 det hele tatt >20 km. Kjeglekasting (21 delstraaler ±10°,
#                 80-persentil) - som allerede fikser enkeltskjaer - IKKE
#                 nok her, fordi selve sundet/kanalen ofte er bredere enn
#                 ±10°. swell_window forblir et manuelt/skjonnsbasert felt,
#                 satt fra lokalkunnskap (facing, notes) - ikke fra geodata.
#  spread_s:      KUN klasse A/B (klasse C har sitt eget gate.spread_s,
#                 se der) - cos^(2s) retningsspredning rundt modellens
#                 dir_eff, brukt av physics.window_factor() til aa vekte
#                 hs mot swell_window (ordre 2026-09-03, erstattet en
#                 flat/lineaer-taper-modell - se rapport til bruker og
#                 window_factor() sin egen docstring for hele
#                 begrunnelsen/simuleringen). Senter = midtpunkt av
#                 swell_window, halvbredde = halve vinduet. Samme
#                 feltnavn og standardverdi (5) som gate.spread_s - LAV s
#                 = bredere spredning = mer slipper inn.
#  offshore_point: [lat, lon], kun klasse A/B. TO FORMAAL PAA SAMME FELT
#                 (ordre 2026-09-02, se rapport til bruker om Hvasser) -
#                 IKKE flytt uten aa vite at begge endres:
#                   1. Modell-lesepunkt: agent.py sin gather() henter
#                      Hs/Tp/dir herfra (S.met_waves()) - dette ER
#                      spottens raa boelgedata (model_hs/model_tp i
#                      evaluate_class_ab()). Flytting endrer prognosen,
#                      ikke bare en diagnostikk-detalj.
#                   2. Retningsreferanse for dybdeprofilen: build_fetch.py
#                      sin depth_bearing_for_spot() skyter dybdesoeket
#                      langs peilingen fra spotens (lat, lon) til dette
#                      punktet (fallback: gate, saa facing - se der).
#                 Punktet skal derfor velges etter hvor SWELLEN FAKTISK
#                 KOMMER FRA (innenfor swell_window), IKKE etter hvor det
#                 er dypest eller naermest. Et spot med to energikilder
#                 (som Hvasser: lokalt NO-dypvann i Sandosundet OG
#                 SO-swell mot Koster/Skagen) maa velge PAA SWELLEN sin
#                 side av det valget - offshore_point kan bare peke ett
#                 sted. build_fetch.py sin STEG 1 (offshore_point_bearing_check())
#                 advarer automatisk hvis peilingen faller utenfor
#                 spottens eget swell_window - kjor den etter enhver
#                 flytting.
#  klasse:
#     A = apen Skagerrak-kyst. Les Hs/Tp/dir rett fra WW3/WAM.
#     B = fjordmunning. Som A, men sjekk ogsa lokal fetch.
#     C = indre fjord. Modellene duger IKKE. Regn lokal fetch + propager
#         S-komponenten fra munningen.
#
#  fetch_km:      16 verdier fra N og med klokka (N, NNO, NO, ONO, O, OSO,
#                 SO, SSO, S, SSV, SV, VSV, V, VNV, NV, NNV).
#                 For klasse C er dette avstand til NAERMESTE land ELLER
#                 til fjordmunningen - ikke helt ut i Skagerrak. Swellen
#                 utenfra handteres separat av gate-blokka.
#
#  fetch_km_72,
#  fetch_km_72_effektiv,
#  fetch_km_72_endelig,
#  fetch_km_72_kjegle,
#  skjaergaard_indeks,
#  fetch_km_manuell,
#  dybde_Xm_km:   MAALTE felt fra build_fetch.py (Kartverket Kystkontur/
#                 Dybdekurve, CC BY 4.0 - se fetch_geodata.py). IKKE brukt av
#                 physics.py/ensemble.py ennaa - kun lagt inn for
#                 sammenligning mot de haandlagde tabellene over.
#                   fetch_km_manuell = kopi av fetch_km/local_fetch_km slik de
#                     saa ut foer maaling, saa de to kan diffes.
#                   fetch_km_72 = 72 verdier (hver 5. grad fra N, med klokka)
#                     fra RAA enkelt-straaleskyting mot kystkontur, tak 300 km.
#                     Mange av "300 km"-verdiene er IKKE reell fetch - de er
#                     straaler som forlot det nedlastede bbox-utsnittet uten
#                     aa treffe land (se fetch_km_72_endelig).
#                   fetch_km_72_effektiv = medianen av straalen og naboene i
#                     en +-10 graders sektor rundt hver retning. Fikser IKKE
#                     bbox-kant-problemet (en median av fem kant-verdier er
#                     fortsatt en kant-verdi) - beholdt for referanse.
#                   fetch_km_72_endelig = DEN som faktisk boer brukes. Hver
#                     straale er klassifisert "kyst" (ekte treff mot
#                     kystkontur - maalt lengde brukt) eller "bbox_kant"
#                     (forlot utsnittet uten aa treffe noe - en kjent
#                     ANALYTISK avstand til land brukt i stedet, se
#                     ANALYTIC_SECTORS i build_fetch.py: 160-200 grader mot
#                     Skagen ~145 km, 200-230 mot Hirtshals ~200 km, 230-250
#                     mot Skagerrak-aapningen ~240 km, ellers 60 km/usikker).
#                     Avviksrapporten sammenligner KUN "kyst"-retninger mot
#                     fetch_km_manuell - det er den eneste sammenligningen
#                     som maaler noe reelt.
#                   fetch_km_72_kjegle = KJEGLEKASTING i stedet for enkelt-
#                     straale. En enkelt straale maaler geometri, ikke
#                     boelgefetch: en holme paa noen hundre meter stopper en
#                     straale, men ikke boelgeenergien - den diffrakterer
#                     rundt og fortsetter. For hver av de 72 hovedretningene
#                     skytes 21 delstraaler over +-10 grader (1 graders
#                     mellomrom - se merknad ved CONE_STEP_DEG i
#                     build_fetch.py om at "hvert halve grad" i bestillingen
#                     ville krevd 41 straaler for samme spenn; 21 er brukt og
#                     avviket er bevisst flagget, ikke stille rettet). 80-
#                     persentilen av de "kyst"-klassifiserte delstraalene
#                     brukes (ikke median, ikke maks) - en enkelt holme rett
#                     i siktelinjen faar da ikke stoppe hele retningen, mens
#                     sammenhengende kystlinje fortsatt gjoer det. Samme
#                     analytiske utfylling som _endelig brukes naar over
#                     halvparten av kjeglen er bbox_kant (aapent hav).
#                   STOPP (ordre 2026-08-31): alle tre varianter over
#                     (fetch_km_72/_endelig/_kjegle) gir fortsatt 8-20 km
#                     avvik mot haandmaalingene - IKKE en feil som kan
#                     kodes bort, men en metodeforskjell. Straalekasting i
#                     alle varianter maaler geometrisk siktelinje;
#                     haandmaalingene maaler boelgerelevant aapent vann -
#                     bare den siste er riktig for fetch-begrenset
#                     boelgevekst. Ingen av fetch_km_72*-feltene erstatter
#                     derfor fetch_km/local_fetch_km. De blir staaende som
#                     referanse. Flere korreksjonsforsok er ikke planlagt.
#                   skjaergaard_indeks = gjennomsnittlig |80-persentil minus
#                     median| over kjeglens hovedretninger (samme tall som
#                     report_kjegle_skew() logger). Hoy verdi betyr at
#                     enkeltskjaer i kjeglen varierer mye - spotten er
#                     skjaergaardsdominert, og enhver geometrisk fetch-
#                     maaling der er mindre til aa stole paa. Tiltenkt aa
#                     senke `confidence` i ensemble.py for hoy-indeks-
#                     spotter, men IKKE koblet inn der ennaa.
#                   dybde_20m_km/_30m_km/_50m_km = avstand fra spottens
#                     koordinat til hhv. 20-, 30- og 50-meterskoten langs
#                     `facing`-retningen. null hvis koten ikke ble truffet.
#                     MAALT og paalitelig - ingen del av fetch-uenigheten
#                     over. Ingen etterbehandling tilsvarende _effektiv/_endelig -
#                     brukes som de maales.
#
#  geodata_stale: valgfritt, true/uteglemt. Satt naar fetch_km_72*/dybde_*-
#                 feltene over IKKE er malt fra spottens GJELDENDE (lat, lon) -
#                 enten fordi koordinatet er rettet siden siste build_fetch.py-
#                 kjoring (feltene henger igjen fra det gamle punktet), eller
#                 fordi spotten er ny og aldri har hatt dem malt i det hele
#                 tatt. Se kommentaren ved feltet paa hver spot for hvilket
#                 koordinat de gjeldende verdiene faktisk stammer fra (om
#                 noen). IKKE lest av physics.py/agent.py/ensemble.py -
#                 rent en markor for hva som maa regnes paa nytt naar
#                 build_fetch.py kan kjores. build_fetch.py fjerner flagget
#                 selv naar den har skrevet ferske verdier for spotten.
#
#  gate:          kun klasse C. Punktet i fjordmunningen der vi leser
#                 WW3-output og propagerer innover.
#    sector_half_width: hvor bred vinkelsektor fjorden slipper opp.
#                       LAV verdi = strengere = mindre bolge. Viktigste knapp.
#    spread_s:          cos^(2s) retningsspredning i kildesjoen.
#                       LAV s = bredere spredning = mer slipper inn.
#    transmission:      samleknapp for alt vi ikke modellerer (skjaergard,
#                       refraksjonstap). Start pa 1.0, juster ned hvis
#                       agenten overvurderer.
#
#  regional_wp_min,
#  regional_wp_max:  DEAKTIVERT (ordre 2026-09-02, backtest_sessions.py
#                 mot sessions_historisk.csv - se rapport til bruker).
#                 Feilkalibrert, ikke bare unoyaktig: alle tre Saltstein-
#                 oktene i backtesten (to "svaert bra", en "sesongens
#                 beste") ble stengt av porten - regional_wp laa 1,2-2,8
#                 kW/m mot terskelen 12,2, en faktor 4-10 for lavt.
#                 Konverteringen fra surf-forecast sin skala (se ankeret
#                 under) holder rett og slett ikke. IKKE justert til et
#                 nytt tall - deaktivert, siden det ikke finnes grunnlag
#                 for aa gjette en bedre terskel ennaa. Alle tre spot-
#                 oppforingene under har derfor regional_wp_min/max
#                 satt til null (tomt = "ingen grense", se under) - kun
#                 verdiene er endret, IKKE koden (score_hour() i
#                 agent.py haandterer None uendret) og IKKE feltene
#                 (fortsatt fjernet fra spots.yaml ville vaert et STORRE
#                 grep-avtrykk enn aa bare nulle dem). regional_wp
#                 LOGGES fortsatt (se agent.py sin score_hour()) - porten
#                 er av, maalingen er det ikke. Kalibrer empirisk mot
#                 ekstern_wp naar nok parvise observasjoner finnes,
#                 i stedet for aa gjette paa nytt fra surf-forecast sin
#                 skala.
#
#                 KONKLUSJON (ordre 2026-09-02, avsluttende runde - se
#                 rapport til bruker): ERA5-Ocean (backtest_sessions.py
#                 sin kilde) kan IKKE brukes til noen ny gjetning her -
#                 se dens docstring for opplosningsfunnet (0,25 graders
#                 grid, alle 14 spots faller i FIRE celler, aatte i EN).
#                 Det ene tallet den likevel gir oss: gulvet blant elleve
#                 positive okter var regional_wp=1,2 kW/m (Saltstein,
#                 kvalitet 5, 2018-12-18) - mot den deaktiverte terskelen
#                 12,2. TI GANGER for hoy, samme retning og storrelsesorden
#                 som feilfunnet over. regional_wp_min FORBLIR deaktivert -
#                 dette bekrefter at det var riktig aa sla den av, det gir
#                 ikke et nytt tall aa sette den til. Neste kalibrerings-
#                 forsok maa bruke out/shadow.csv fra faktisk drift (EWAM
#                 ~5 km/MET WW3 ~4 km, se sources.py - opploser kysten,
#                 ERA5-Ocean sitt 28 km-grid gjor ikke det), ikke ERA5.
#
#                 Resten av denne feltbeskrivelsen er HISTORIKK - hvordan
#                 feltet var TENKT aa virke, og hvilke tall (na null/
#                 utelatt paa alle spots) det stod paa foer det ble
#                 deaktivert over. Beholdt for aa vise HVORFOR de gamle
#                 tallene var feil, ikke fordi noe av det under fortsatt
#                 gjelder:
#
#                 EN EGEN, UAVHENGIG port paa toppen av
#                 IKKE samme stedsreferanse. min_hs maaler boelgehoyde VED
#                 SPOTTEN (etter propagering/lokal fetch der det gjelder).
#                 regional_wp_min/max maaler agent.py sin regional_wp -
#                 wave_power() av raa modell-hs/tp ved Saltsteins
#                 offshore_point, se agent.py sin run(). Samme tall for
#                 alle spots, uansett hvor de selv ligger.
#                 Kalibrert 2026-09-02 mot observerte terskler (surf-
#                 forecast sitt Saltstein-referansetall), ankeret i
#                 wave_power(2.5, tp_est(2.5)) = 20.35 kW/m = ratio 1.0:
#                   saltstein lukker seg  ratio 1.6 -> 32.6 kW/m (max)
#                   hvasser starter       ratio 1.9 -> 38.7 kW/m (min)
#                   slagen starter        ratio 3.2 -> 65.1 kW/m (min)
#                   slagen taaler opptil  ratio 12.0 -> 244.2 kW/m (max)
#                 IKKE regnet om til min_hs/max_hs direkte - de tallene
#                 forsokt forst, men bommer stygt (Slagen min_hs=4.06 m
#                 hadde slaatt spotten av helt; modellen regner selv ut
#                 2.2-2.8 m der pa en god dag). Se score_hour() i agent.py:
#                 er regional_wp under _min eller over _max, tvinges
#                 scoren til 0 UANSETT hva den lokale fysikken sier -
#                 to uavhengige kriterier, begge maa klaffe. null/utelatt
#                 felt = ingen grense den veien.
#                 Unntak (ordre 2026-09-02, backtest mot ekte historikk):
#                 porten stenger ALDRI naar spottens EGEN lokale sjo
#                 dominerer over det regional_wp maaler (source er
#                 "local_fetch", eller local_hs > prop_hs for klasse C) -
#                 Hvasser sin SO-fetch mot Koster/Skagen bygger en lokal
#                 sjo helt uavhengig av Skagerrak-swellen 38.7-tallet over
#                 er kalibrert mot. Se score_hour() sin docstring.
# =====================================================================

defaults:
  min_tp: 5.0
  water_optimal_cm: 0
  water_sensitivity_cm: 0        # 0 = vannstand ignoreres
  wind_weight: 1.0               # <1 = spotten taaler chop, >1 = vindfolsom
  wind_floor: 0.10               # GULV for q_wind, ikke helning (se wind_weight over -
                                  # to ulike fysiske egenskaper, se physics.apply_wind_weight()/
                                  # apply_wind_floor() sine docstrings, ordre 2026-09-03).
                                  # 0.10, ikke 0.15 - ville bundet utilsiktet for spot med
                                  # wind_weight > 1.0 (0.15**1.25 ≈ 0.107 < 0.15). Overstyr
                                  # per spot naar det finnes en strukturell grunn (dyptvannsrev
                                  # osv.) - se saltstein.
  alert_min_p_surf: 50           # varsle nar sannsynlighet >= denne (%)
  alert_min_stars: 5.5           # OG forventet kvalitet >= denne (1-10)
  min_window_hours: 2
  uncertainty:                   # standardavvik ved varslingslengde 0
    wind_rel: 0.10               #   vindstyrke, relativt
    wind_dir_deg: 8              #   vindretning
    hs_rel: 0.15                 #   Hs ved munningen, relativt
    wave_dir_deg: 10             #   bolgeretning
    transmission_rel: 0.20       #   strukturell - dobles for ukalibrerte spots
    sector_deg: 3.5              #   strukturell - dobles for ukalibrerte spots

spots:

  # ------------------------------------------------ KLASSE A - apen kyst

  - id: saltstein
    name: Saltstein
    klasse: A
    lat: 58.965643      # rettet (ordre 2026-09-02): malt i Norgeskart, var 58.955/9.855 (1,24 km feil)
    lon: 9.848614
    offshore_point: [58.930, 9.830]
    wind_weight: 0.55          # kraftig dyptvannsrev - surfes rutinemessig i onshore chop
    wind_floor: 0.40           # ordre 2026-09-03, se rapport til bruker: samme begrunnelse
                                # som wind_weight over (dyptvannsrev, jekker opp uavhengig av
                                # vindretning), men et GULV, ikke en helning - de to feltene
                                # uttrykker ulike egenskaper, se physics.apply_wind_floor().
                                # IKKE hev for aa snu ett bestemt utfall (en mandag/loerdag) -
                                # det ville vaere kalibrering mot ett doegn, ikke mot spottens
                                # kjente karakter.
    facing: 225
    swell_window: [170, 260]
    spread_s: 5                # se spread_s i toppteksten - standardverdi, ikke tunet enda
    # ordre 2026-09-03 (rekalibrering, se rapport til bruker): min/ideal
    # senket fra 1.2/2.5 til 0.8/1.9 - max_hs (4.5) UENDRET, ikke roert.
    # To uavhengige grunner:
    #   1. surf-forecast (ekstern kilde) setter selv nedre surfbar-terskel
    #      for Saltstein til 0,8 m ved 7 s - samme tall, uavhengig kilde.
    #   2. Observert topp uke 3.-9. sept 2026 var 1,5-1,7 m, beskrevet
    #      lokalt som svaert gode forhold - godt under det gamle idealet
    #      (2,5), som dermed presset stjernene systematisk ned for noe
    #      som faktisk var bra.
    # Den nye trippelen er ogsaa tilnaermet symmetrisk i log-Hs
    # (1,9/0,8 = 2,38, 4,5/1,9 = 2,37) mot den gamle sin skjeve
    # (2,5/1,2 = 2,08, 4,5/2,5 = 1,80) - IKKE selve begrunnelsen for
    # endringen, men et tegn paa at den nye trippelen er mer konsistent
    # med physics.size_quality() sin kurveform (symmetrisk stigning/fall
    # rundt idealet paa log-skala).
    #
    # max_hs senket fra 4.5 til 2.2 (ordre 2026-09-07, se rapport til
    # bruker) - den AAPNE enden fra ordren over er na lukket med oektdata:
    # fotogrammetri mot en surfer i klipp IMG_1252 (5. sept, hs_eff 1,4)
    # ga 2,3-2,8 m bolgevegg med naer-closeout paa de storste settene.
    # 2,2 er derfor rett UNDER det faktisk observerte brytepunktet, ikke
    # et gjettet tak - egen commit, se kalibrert-merknaden under for
    # hvorfor.
    min_hs: 0.8
    ideal_hs: 1.9
    max_hs: 2.2
    min_tp: 6.0
    water_optimal_cm: -10
    water_sensitivity_cm: 60
    drive_min: 110
    # kalibrert satt tilbake til false (ordre 2026-09-03) - den forrige
    # kalibreringen ("kjent spot - bruk som referanse") gjaldt kurven
    # 1.2/2.5/4.5 og er ikke lenger gyldig for 0.8/1.9/4.5. model_rev
    # (se agent.py sin _model_rev()) skifter naar denne commiten naar
    # produksjon, saa calibrate.py sin (spot, model_rev)-gruppering
    # holder gamle og nye Saltstein-rader fra hverandre automatisk -
    # se test_calibrate.py sin test_ulike_model_rev_gir_egne_seksjoner_i_rapporten
    # (bruker allerede saltstein som eksempel).
    #
    # FORBLIR false etter max_hs-endringen 2026-09-07 - trippelen er na
    # 0.8/1.9/2.2, en TREDJE kurve, fortsatt ikke kalibrert mot noen
    # okter. Egen commit her ogsaa, av samme grunn: nytt model_rev, ny
    # epoke i calibrate.py.
    kalibrert: false
    regional_wp_min:               # DEAKTIVERT (ordre 2026-09-02) - se merknad ved
                                    # regional_wp_min/max i toppteksten. Stod paa 12.2,
                                    # utledet ved lineaer ekstrapolering fra surf-forecast
                                    # sin skala (ankeret 250 = 20.35 kW/m). Backtest mot
                                    # sessions_historisk.csv: alle tre Saltstein-oktene
                                    # (kvalitet 4, 4, 5 av 5) hadde regional_wp paa
                                    # 1.2-2.8 kW/m - en faktor 4-10 under 12.2. Porten
                                    # hadde stengt samtlige. Konverteringen holder ikke -
                                    # ikke justert til et nytt tall, bare slaatt av.
    regional_wp_max:                # DEAKTIVERT (ordre 2026-09-02) - stod paa 32.6,
                                    # samme ekstrapolering, samme forbehold. Ingen
                                    # backtest-okt traff denne siden - kun _min var
                                    # tydelig feil - men samme metode ligger bak begge,
                                    # saa begge slaas av til en ekte kalibrering finnes.
    notes: >
      Referansespotten. SV-vendt steinrev. "Jekker fra dypt vann" var en
      antagelse - malt paa nytt (ordre 2026-09-02) etter koordinatrettingen
      over viser 50-meterskoten 1,59 km ute langs facing, ikke 0,4 km som
      de gamle (geodata_stale) tallene fra feilkoordinatet viste. Fire
      ganger lengre. Boer sjekkes mot faktisk surfeerfaring foer "dypt
      vann rett utenfor" gjentas som en etablert sannhet - se
      geodata_stale-merknaden ved feltene under, dybde_50m_km er ikke
      oppdatert til 1,59 km her ennaa (build_fetch.py maa kjores paa nytt
      i et miljo med nettverkstilgang, se rapport til bruker).
