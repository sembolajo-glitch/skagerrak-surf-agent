                                  # (shadow.csv) under den gamle iden gjaldt det andre
                                  # stedet og er ikke gyldig her.
    notes: >
      Tristein - klippe/skjaer ved Faerder fyr, kun tilgjengelig med baat.
      Erstatter "Verdens Ende / Tristein" (id verdens_ende, slettet - se
      kalibrert-merknaden over for hvorfor det ikke bare ble et navnebytte).

      Fysisk begrunnelse (manuell maaling, Norgeskart 2026-09-07): revlinja
      paa vestsiden har trend 169/349 grader, maalt lengde 231,27 m.
      20-meterskoten ligger 50-100 m vest for revkanten (helning ca. 1:5) -
      en svaert kort hylle. Grunne skjaer innenfor: loddskudd +1,3, +1,9,
      +2,4. Transekt sorover fra revet: peiling 151 grader, naar ca. 100 m
      ved 1,15 km, midlere helning ca. 1:11.

      Koordinat rettet 2026-09-07 (se rapport til bruker og merknaden ved
      lat/lon over) - brukeren oppga et nytt koordinat etter forrige runde,
      som hadde land 87-130 m unna i hele 220-300 graders-sektoren (en
      geometrisk selvmotsigelse som ble rapportert, ikke tildekket, i
      forrige commit). Det nye koordinatet er verifisert mot ekte
      kystkontur.geojson: aapent hav i hele 140-259 graders-sektoren.
      build_fetch.py sin egen dybdeprofil langs offshore_point-peilingen
      (~239 grader, se offshore_point over) gir 20 m paa 0,16 km og 50 m
      paa 0,71 km (30 m: data_slutt, se dybde_30m_status under - IKKE det
      samme som "ingen kote finnes", bare at det nedlastede utsnittet tok
      slutt foer koten evt. ble funnet). Dette er en ANNEN straale enn den
      manuelle 151-graders-transekten over (som fant 100 m paa 1,15 km) -
      rapportert som to uavhengige maalinger, ikke reconcilert, samme
      prinsipp som for Skallevold.

      Den korte hylla (20 m bare 50-100 m ute) gir for lite avstand til at
      kammen rekker aa refraktere seg parallell med revet. Donning fra SV
      treffer derfor 30-55 grader skraatt og beholder vinkelen fram til
      brekket, som gir peel i stedet for closeout. Peelhastighet
      c/sin(alfa): med c = 5,4 m/s paa 3 m dyp og 34 graders vinkel blir
      det ca. 9,7 m/s, altsaa ca. 24 s over de 231 m. Bryte­kriteriet
      Hb = 0,78*hb krever 3,9 m brytende hoyde for aa brekke paa 5 m vann -
      derfor de hoye tersklene (min/ideal/max BEHOLDT uendret, se over).

      Operativt vindu: avtagende fase etter SV-kuling. Donningen staar
      igjen, vinden har dreid nordlig (fralands for vestvendt rev), og
      sjoen har lagt seg nok til at baatturen fra Verdens Ende (4-5 km
      aapen kryssing) er forsvarlig. Anslagsvis 4-8 timer.

      Faerder nasjonalpark - ilandstigningsforbud i hekketiden paa flere
      holmer i omraadet (se access_warning-feltet, som allerede finnes og
      brukes av Bastoy odden - ingen ny mekanisme bygget her). Sjekk
      gjeldende skilting/forskrift for akkurat denne holmen foer landgang.

      drive_min er IKKE satt - ingen reelt anslag paa kjoretid til
      utsettingspunktet (Verdens Ende) + baattid finnes enna, og et gjettet
      tall ville vaert verre enn ingen tall.
    access_warning: >
      Færder nasjonalpark. Ilandstigningsforbud i hekketiden på flere
      holmer i området - sjekk gjeldende skilting/forskrift for denne
      holmen før du går i land. Vurder å holde deg i vannet/på brettet.

