name: diagnose-saltstein

# Engangsdiagnostikk (ordre 2026-09-02): Saltstein 2018-12-18 ("sesongens
# beste", kvalitet 5/5) fikk hs_eff=0.78 m i backtest-sessions.yml sin
# forrige kjoring - urimelig lavt. Foer noen terskel justeres: sjekk om
# tallet er ekte, eller et artefakt av (1) offshore_point som ikke ble
# flyttet med da spot-koordinatet ble rettet 1,24 km, (2) en udokumentert
# antagelse om at sessions_historisk.csv sin 'tid'-kolonne allerede er
# UTC (kan vaere norsk lokaltid), eller (3) ERA5 sitt grovs 0,25-graders
# grid. Se diagnose_saltstein_20181218.py sin docstring for alle tre.
#
# KUN manuell trigger. Rorer ingen repo-filer, committer ingenting -
# rent utgaaende API-kall og utskrift (samme prinsipp som probe-marine-
# archive.yml/ab-test.yml).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter (hoved + geodata for geo_utils.py)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-geodata.txt

      - name: Kjor diagnose_saltstein_20181218.py
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u diagnose_saltstein_20181218.py | tee diagnose_output.txt

      - name: Skriv resultatet til step summary
        if: always()
        run: |
          {
            echo "# Diagnose: Saltstein 2018-12-18"
            echo
            echo '```'
            cat diagnose_output.txt 2>/dev/null || echo "(ingen utskrift - se loggen fra forrige steg)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
