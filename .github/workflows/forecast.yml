name: forecast

# Kjorer i takt med modellkjoringene. MEPS og ECMWF er ferdig distribuert
# ca. 3-4 timer etter analysetidspunkt, saa vi ligger litt etter 00/06/12/18Z.
on:
  schedule:
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      shadow:
        description: "Skyggemodus - regn og logg, ikke varsle"
        type: boolean
        default: false

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Historikk: alert_state.json og shadow.csv ligger paa data-grenen slik
      # at de overlever mellom kjoringer. Uten dette faar du varsel om samme
      # vindu hver sjette time.
      #
      # spotgrid.json rundes paa samme maate - MEN denne kjoringen regner
      # den aldri ut selv (den er statisk, se geodata.yml sin
      # build_spotgrid.py). Den eneste jobben til denne kjoringen er aa
      # hente den her og legge den rett tilbake paa data-grenen igjen
      # under (se "Publiser til data-grenen"), slik at den overlever den
      # naeste --orphan-force-pushen og dermed havner i upload-pages-
      # artifact under, klar for spot-testeren i frontenden.
      #
      # scripts/fetch_shadow_state.sh - se den for rotaarsaken til hvorfor
      # shadow.csv haandteres strengere enn de to andre filene (skal feile
      # hardt paa en reell hente-feil, ikke stille gi en tom fil). Egen
      # fil (ikke inlinet her) fordi den trenger aa vaere kjorbar isolert
      # i test_fetch_shadow_state.py.
      - name: Hent tilstand fra data-grenen
        run: scripts/fetch_shadow_state.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Selvtest
        run: |
          pip install pytest
          python -m pytest test_physics.py -q
          python agent.py --mock storm > /dev/null

      - name: Kjor prognose
        env:
          SURF_AGENT_UA: ${{ secrets.SURF_AGENT_UA }}
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python agent.py ${{ inputs.shadow && '--shadow' || '' }} | tee out/run.log

      # Siste vern mot aa PUSHE OVER eksisterende historikk (se
      # rotaarsak-merknaden ved "Hent tilstand fra data-grenen"): kjort
      # HER, foer "Trim logg" - trimming er en VILJET, kjent reduksjon
      # (se den), og skal ikke feilaktig utlose dette. >=, ikke >:
      # header-reparasjon (append_shadow_log()) legger lovlig til noyaktig
      # én linje uten nye datarader (se agent.py sin docstring der).
      - name: Sjekk at shadow.csv ikke krympet
        run: |
          rows_before=$(cat out/.rows_before)
          rows_after=$(wc -l < out/shadow.csv)
          echo "rader for: $rows_before, etter: $rows_after"
          if [ "$rows_after" -lt "$rows_before" ]; then
            echo "FEIL: shadow.csv har faerre rader enn foer kjoringen ($rows_after < $rows_before)."
            echo "Avbryter for aa unngaa aa pushe over eksisterende historikk paa data-grenen."
            exit 1
          fi

      # Roterer shadow.csv naar den blir stor - ett ars data er rikelig
      - name: Trim logg
        run: |
          if [ -f out/shadow.csv ] && [ "$(wc -l < out/shadow.csv)" -gt 800000 ]; then
            head -1 out/shadow.csv > out/shadow.tmp
            tail -n 700000 out/shadow.csv >> out/shadow.tmp
            mv out/shadow.tmp out/shadow.csv
          fi

      - name: Publiser til data-grenen
        run: |
          git config user.name  "surf-agent"
          git config user.email "surf-agent@users.noreply.github.com"
          git checkout --orphan tmp-data
          git rm -rf --cached . > /dev/null
          add_args=(out/forecast.json out/spots out/shadow.csv out/alert_state.json out/run.log)
          [ -f out/spotgrid.json ] && add_args+=(out/spotgrid.json)
          git add -f "${add_args[@]}"
          git commit -m "prognose $(date -u +%FT%TZ)" || exit 0
          git branch -M tmp-data data
          git push -f origin data

      # path: out laster opp HELE mappa, saa spotgrid.json (rundet inn fra
      # data-grenen over - se "Hent tilstand fra data-grenen") blir med
      # automatisk naar den finnes, uten noe eget filoppslag her.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
