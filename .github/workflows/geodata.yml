name: geodata

# Engangsjobb: hent Kystkontur/Dybdekurve fra Kartverket (Geonorge WFS,
# CC BY 4.0) og beregn fetch_km_72/dybde_Xm_km (build_fetch.py),
# diagnosekart per spot (diagnose_spot.py) og out/spotgrid.json
# (build_spotgrid.py). KUN manuell trigger - aldri paa tidsplan. Ruerer
# ikke forecast.yml eller main: kystkontur/dybdekurve + spots.yaml havner
# paa en egen gren (geodata-resultat) for gjennomsyn foer eventuell merge,
# mens spotgrid.json - som er statisk og kun endres her - ogsaa dyttes til
# data-grenen saa forecast.yml sin "Hent tilstand fra data-grenen" runder
# den tilbake inn i out/ (og dermed upload-pages-artifact) uten aa regne
# den ut paa nytt hver dag, se forecast.yml. diagnose_spot.py sine SVG-er
# havner KUN som artifact (diagnose-spot) - ren visualisering, ingenting
# derfra committes noe sted.
# Input "probe" bytter til fetch_geodata.py --probe (diagnostiser bbox/
# akse/CRS mot layerne) og hopper over build_fetch.py, diagnose_spot.py,
# build_spotgrid.py og commit-stegene - artifact-opplastingen av
# data/_raw/ kjorer uansett.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Bare diagnostiser bbox/akserekkefolge/CRS (fetch_geodata.py --probe) - ikke last ned eller committ noe"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  geodata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: pip install -r requirements-geodata.txt -r requirements-dev.txt

      # continue-on-error slik at artifact-opplastingen av data/_raw/ lenger
      # ned kjorer selv om nedlastingen/parsingen mot Kartverket ryker - det
      # er eneste maaten aa faa ut raadata for feilsoeking naar dette kjores
      # fra Actions og ingen har terminaltilgang til runneren.
      - name: Hent geodata fra Kartverket
        id: fetch
        continue-on-error: true
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python fetch_geodata.py --probe
          else
            python fetch_geodata.py --dump-raw
          fi

      - name: Sjekk filstorrelse
        run: |
          set -e
          fail=0
          for f in data/kystkontur.geojson data/dybdekurve.geojson; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f finnes ikke - fetch_geodata.py leverte ikke dette laget"
              continue
            fi
            bytes=$(stat -c%s "$f")
            mb=$(( bytes / 1024 / 1024 ))
            echo "$f: ${mb} MB (${bytes} bytes)"
            if [ "$bytes" -gt $((90 * 1024 * 1024)) ]; then
              echo "::error::$f er ${mb} MB - over 90 MB-taket. Ok forenklingstoleranse i fetch_geodata.py (--tolerance-m) eller trangere --bbox og kjor paa nytt."
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

      - name: Beregn fetch og dybdeprofil (build_fetch.py)
        if: inputs.probe != true
        run: python build_fetch.py

      # forecast.json sin siste kjoring (om den finnes) - KUN for
      # grid_lat/grid_lon/grid_avstand_km (ordre 2026-09-03, se rapport til
      # bruker) som diagnose_spot.py sine to nye gridcelle-flagg leser.
      # Tolerant paa samme maate som alert_state.json/spotgrid.json i
      # scripts/fetch_shadow_state.sh (IKKE shadow.csv sin strenge variant -
      # forecast.json har ingen akkumulert historikk aa miste, kun siste
      # kjoring) - manglende fil (data-grenen finnes ikke enna, eller
      # forecast.yml har aldri kjort) er ikke en feil, diagnose_spot.py
      # hopper bare over de to flaggene da.
      - name: Hent siste forecast.json fra data-grenen (kun for gridcelle-flagg)
        if: inputs.probe != true
        run: |
          mkdir -p out
          git fetch --depth=1 origin data 2>/dev/null || true
          git show origin/data:out/forecast.json > out/forecast.json 2>/dev/null || true

      # Ett diagnosekart (SVG) per spot - kystkontur/dybdekoter/offshore_point/
      # facing/dybdepeiling/swell_window/fetch_km-rose, pluss en oversiktsside
      # med alle spots side om side - rett fra spots.yaml sine (naa ferske,
      # se steget over) felt og geodataene. Syv avvik markeres automatisk i
      # roedt - se diagnose_spot.py sin docstring. Staar etter build_fetch.py
      # (trenger dybde_Xm_km/status/skjaergaard_indeks derfra), foer
      # build_spotgrid.py (uavhengig rekkefolge, men gruppert med de andre
      # "beregn/tegn fra geodata"-stegene).
      - name: Tegn diagnosekart (diagnose_spot.py)
        if: inputs.probe != true
        run: python diagnose_spot.py

      # Statisk rutenett over kandidat-surfpunkter (d20/d30/d50, apen
      # sektor/retning) - se build_spotgrid.py sin docstring. Trenger bare
      # kystkontur/dybdekurve, ikke spots.yaml, saa den kan kjore uavhengig
      # av build_fetch.py over - men staar etter den her fordi begge er
      # "beregn fra geodata"-steg.
      - name: Bygg spotgrid (build_spotgrid.py)
        if: inputs.probe != true
        run: python build_spotgrid.py

      # Feiler (exit 1) hvis et referansepunkt bryter sin avstandsterskel -
      # se validate_geodata.py. Tegner uansett ut/kystkontur_preview.svg,
      # ogsaa ved feil, siden det er akkurat da bildet er mest nyttig
      # (er konturen synlig speilvendt?). Blokkerer committ-steget under
      # ved feil - vi skal ikke committe data vi ikke stoler paa.
      - name: Valider geodata
        if: inputs.probe != true
        run: python validate_geodata.py

      - name: Kjor tester
        run: python -m pytest -q

      - name: Committ resultatet til geodata-resultat
        if: inputs.probe != true
        run: |
          git config user.name  "surf-agent"
          git config user.email "surf-agent@users.noreply.github.com"
          git checkout -B geodata-resultat

          shopt -s nullglob
          geo_files=(data/*.geojson)
          if [ ${#geo_files[@]} -gt 0 ]; then
            git add "${geo_files[@]}"
          fi
          git add spots.yaml
          [ -f out/spotgrid.json ] && git add -f out/spotgrid.json

          git commit -m "geodata: kystkontur/dybdekurve + fetch_km_72/dybde_Xm_km + spotgrid.json ($(date -u +%FT%TZ))" \
            || echo "ingen endringer aa committe"
          git push -f origin geodata-resultat

      # spotgrid.json alene (ikke kystkontur/dybdekurve/spots.yaml, som
      # skal gjennom manuell gjennomsyn paa geodata-resultat foerst) dyttes
      # ogsaa rett til data-grenen: den er den eneste av filene her
      # forecast.yml faktisk leser (via "Hent tilstand fra data-grenen") og
      # inkluderer i upload-pages-artifact. data-grenen force-pushes hver
      # gang forecast.yml kjorer, saa dette folger samme "gjenopprettbar
      # tilstand, ikke historikk aa ta vare paa"-konvensjon som resten av
      # den grenen (se forecast.yml).
      - name: Publiser spotgrid.json til data-grenen
        if: inputs.probe != true
        run: |
          if [ ! -f out/spotgrid.json ]; then
            echo "::warning::out/spotgrid.json finnes ikke - hopper over publisering til data-grenen"
            exit 0
          fi
          git config user.name  "surf-agent"
          git config user.email "surf-agent@users.noreply.github.com"
          cp out/spotgrid.json /tmp/spotgrid.json

          git fetch origin data:data 2>/dev/null || echo "data-gren finnes ikke enna"
          git checkout data 2>/dev/null || git checkout --orphan data

          mkdir -p out
          cp /tmp/spotgrid.json out/spotgrid.json
          git add -f out/spotgrid.json
          git commit -m "geodata: spotgrid.json ($(date -u +%FT%TZ))" || echo "ingen endringer aa committe"
          git push -f origin data

      - name: Last opp raadata som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geodata-raw
          path: data/_raw/
          if-no-files-found: warn
          retention-days: 14

      - name: Last opp diagnosekart som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-spot
          path: out/diagnose/
          if-no-files-found: warn
          retention-days: 14

      - name: Last opp kart-forhaandsvisning som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kystkontur-preview
          path: out/kystkontur_preview.svg
          if-no-files-found: warn
          retention-days: 14

      - name: Feil jobben tydelig hvis nedlastingen feilet
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_geodata.py feilet (se steget 'Hent geodata fra Kartverket' over, og last ned artifacten 'geodata-raw' for raadata). Resultatet paa geodata-resultat kan vaere ufullstendig eller mangle et lag."
          exit 1
