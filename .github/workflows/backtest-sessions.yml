name: backtest-sessions

# Kjor backtest_sessions.py (regional boelgeenergi fra ERA5-Ocean mot
# sessions_historisk.csv sin observerte kvalitet) i GitHub Actions -
# samme grunn som ab-test.yml/probe-marine-archive.yml: verken denne
# oekten eller brukerens eget miljo naar Open-Meteo, saa dette er den
# eneste plassen skriptet faktisk kan kjores og gi ekte tall. Se
# backtest_sessions.py sin docstring for hele bakgrunnen - ordre
# 2026-09-02 (gridcelle-diagnosen for Saltstein): ERA5-Ocean sitt
# ~0,25-graders grid er for grovt for LOKAL boelgehoyde naer kysten her
# (bekreftet - tre kandidatpunkter innenfor faa km av Saltstein traff
# NOYAKTIG samme gridcelle, 49-53 km unna). Skriptet kjorer derfor
# INGEN spot-fysikk lenger - kun regional_wp (samme fjerne, aapne
# gridcelle som en rimelig REGIONAL energi-proxy) mot observert kvalitet,
# pluss en rapport over hvilken gridcelle hver av de 14 spottene sitt
# eget bolge-hentepunkt treffer (kollisjoner = ikke uavhengige data).
#
# KUN manuell trigger. Committer ingenting - "permissions: contents:
# read" haandhever det. Resultatet havner baade i loggen (skriptet
# printer selv) og som en markdown-rapport i GITHUB_STEP_SUMMARY (eget
# steg, leser out/backtest_report.json), pluss selve JSON-en som
# artifact for etterkontroll av raadataene.
on:
  workflow_dispatch:
    inputs:
      sessions_csv:
        description: "Sti til okt-CSV-en"
        type: string
        default: sessions_historisk.csv
      bias_sample_n:
        description: "Antall tilfeldige doegn (i tillegg til okt-datoene fra 2023-) for skjevhetsmaalingen"
        type: string
        default: "30"
      seed:
        description: "Fast seed for det tilfeldige skjevhetsutvalget"
        type: string
        default: "20260902"
      skip_bias_quantification:
        description: "Hopp over maalingen og bruk oppgitt skjevhet i stedet (bias_hs/bias_tp under)"
        type: boolean
        default: false
      bias_hs:
        description: "Manuell Hs-skjevhetsfaktor (kun brukt hvis skip_bias_quantification er paa)"
        type: string
        default: ""
      bias_tp:
        description: "Manuell Tp-skjevhetsfaktor (kun brukt hvis skip_bias_quantification er paa)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjor backtest_sessions.py
        env:
          SESSIONS_CSV: ${{ inputs.sessions_csv }}
          BIAS_SAMPLE_N: ${{ inputs.bias_sample_n }}
          SEED: ${{ inputs.seed }}
          SKIP_BIAS: ${{ inputs.skip_bias_quantification }}
          BIAS_HS: ${{ inputs.bias_hs }}
          BIAS_TP: ${{ inputs.bias_tp }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=(--sessions-csv "$SESSIONS_CSV" --bias-sample-n "$BIAS_SAMPLE_N" --seed "$SEED")
          if [ "$SKIP_BIAS" = "true" ]; then
            args+=(--skip-bias-quantification --bias-hs "$BIAS_HS" --bias-tp "$BIAS_TP")
          fi
          python -u backtest_sessions.py "${args[@]}"

      - name: Skriv resultatet til step summary
        if: always()
        run: |
          python - <<'PYEOF'
          import json
          import os

          report_path = "out/backtest_report.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not os.path.exists(report_path):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write("# Regional boelgeenergi mot elleve historiske okter\n\n"
                              "**FEIL**: out/backtest_report.json ble ikke skrevet - "
                              "se loggen fra forrige steg for hva som feilet.\n")
              raise SystemExit(0)

          report = json.load(open(report_path, encoding="utf-8"))
          bias = report["bias"]
          lines = ["# Regional boelgeenergi mot elleve historiske okter\n\n",
                    "Ingen spot-fysikk kjort - ERA5-Ocean sitt ~0,25-graders grid er for "
                    "grovt for lokal boelgehoyde naer kysten her (se backtest_sessions.py "
                    "sin docstring). KUN regional_wp (kW/m) mot observert kvalitet.\n\n",
                    "## Gridcelle per spot\n\n",
                    "| spot | klasse | spurt punkt | gridcelle |\n",
                    "|---|---|---|---|\n"]
          grid_cells = report.get("grid_cells", [])
          for g in grid_cells:
              lines.append(f"| {g['id']} | {g['klasse']} | {g['punkt'][0]},{g['punkt'][1]} | "
                            f"{g['grid'][0]},{g['grid'][1]} |\n")
          by_grid = {}
          for g in grid_cells:
              by_grid.setdefault(tuple(g["grid"]), []).append(g["id"])
          kollisjoner = {grid: ids for grid, ids in by_grid.items() if len(ids) > 1}
          if kollisjoner:
              lines.append("\n**Gridcelle-kollisjoner** (samme celle = ikke uavhengige boelgedatapunkter):\n\n")
              for grid, ids in kollisjoner.items():
                  lines.append(f"- {grid[0]},{grid[1]}: {', '.join(ids)}\n")

          lines.append("\n## Modellskjevhet (ERA5-Ocean / standardmodell)\n\n")
          lines.append("| variabel | median | kvartiler | spenn | n |\n")
          lines.append("|---|---|---|---|---|\n")
          for var in ("hs", "tp"):
              b = bias.get(var, {})
              if "p25" in b:
                  lines.append(f"| {var.upper()} | {b.get('median')} | {b.get('p25')}-{b.get('p75')} | "
                                f"{b.get('min')}-{b.get('max')} | {b.get('n')} |\n")
              else:
                  lines.append(f"| {var.upper()} | {b.get('median')} | (oppgitt manuelt, ikke maalt) | | |\n")

          n_bias_failed = bias.get("n_calls_failed", 0)
          if n_bias_failed:
              failed = ", ".join(d for d, _ in bias.get("failed_dates", []))
              lines.append(f"\n**ADVARSEL**: {n_bias_failed} dato(er) manglet helt fra "
                            f"skjevhetsmaalingen etter gjentatte feil: {failed}. "
                            f"Malingen fortsatte med resten - se `n` over.\n")

          def render_table(rows, title):
              lines.append(f"\n## {title}\n\n")
              lines.append("| dato | spot | kvalitet | forv. stjerner | tid | valgt (UTC) | hs | tp | regional_wp |\n")
              lines.append("|---|---|---|---|---|---|---|---|---|\n")
              ok_rows = [r for r in rows if "feil" not in r]
              for r in sorted(ok_rows, key=lambda r: r["wp"]):
                  fs = r.get("forventet_stars")
                  fs_str = "-" if fs is None else f"{fs:.1f}"
                  lines.append(f"| {r['dato']} | {r['spot']} | {r['kvalitet']} | {fs_str} | {r['tid']} | "
                                f"{r['valgt_tid_utc']} | {r['hs']:.2f} | {r['tp']:.1f} | {r['wp']:.1f} |\n")
              for r in rows:
                  if "feil" in r:
                      lines.append(f"| {r['dato']} | {r['spot']} | {r['kvalitet']} | | FEIL: {r['feil']} | | | | |\n")
              if ok_rows:
                  wps = [r["wp"] for r in ok_rows]
                  lines.append(f"\n**n={len(ok_rows)}, regional_wp: min={min(wps):.1f}, "
                                f"median={sorted(wps)[len(wps)//2]:.1f}, max={max(wps):.1f} kW/m.**\n")
              return ok_rows

          render_table(report["raw"], "Regional energi - raa ERA5")
          render_table(report["corrected"], "Regional energi - skjevhetskorrigert")

          lines.append("\n## Oppsummering\n\n")
          lines.append("Reanalyse, ikke prognose (se backtest_sessions.py sin docstring). "
                        "Alle elleve oktene var positive - tabellene over viser GULVET "
                        "regional_wp positive okter faktisk hadde, ikke en bekreftelse "
                        "paa at lavere regional_wp betyr daarlig surf. Ingen terskler er "
                        "justert av denne kjoringen.\n\n"
                        "'kvalitet' (0-5) og 'forv. stjerner' (1-10) er IKKE samme skala - "
                        "sistnevnte er kvalitet mappet gjennom backtest_sessions.py sin "
                        "KVALITET_TIL_STARS (ulineaer, se der). Sammenlign aldri kvalitet "
                        "direkte mot en modell-stjerneverdi.\n")

          http = report.get("http_stats", {})
          if http:
              lines.append(f"\n**HTTP**: {http.get('n_calls')} kall totalt, "
                            f"{http.get('n_retried')} maatte proeve paa nytt minst en gang.\n")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.writelines(lines)
          print("".join(lines))
          PYEOF

      - name: Last opp backtest_report.json som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: out/backtest_report.json
          if-no-files-found: warn
          retention-days: 30
